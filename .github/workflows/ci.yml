name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: i18n + typecheck + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - name: i18n missing-keys audit
        run: python scripts/audit-missing-keys-v3.py
      - name: Emoji audit
        run: python scripts/audit-emojis.py
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint

  smoke:
    name: Playwright smoke (3 locales)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run smoke tests
        run: npm run test:smoke
        env:
          # Required so `next dev` boots; tests only hit public routes so a
          # placeholder URL works as long as Prisma connects to a real DB.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Sentry stays inert in CI (no DSN) — smoke tests don't need it.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
